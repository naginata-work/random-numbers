<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Number Picker / ランダム数字抽選ツール</title>
<meta name="description" content="範囲内から重複なしで指定個数の数字を抽選。宝くじ番号決めや抽選に。">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4214020669195548"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0f1220; --card: #171b30; --text: #f0f2fb; --sub: #949ac0;
    --accent: #818cf8; --accent2: #fbbf24; --border: #232a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .home-link { font-size: 22px; text-decoration: none; line-height: 1; }
  .lang-btn { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  h1 { font-size: 21px; text-align: center; margin: 4px 0 4px; }
  .lead { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input[type="number"] { width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; background: #10132a; color: var(--text); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 12px; }
  .draw-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; background: var(--accent); color: #100a2e; }
  .balls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  .ball {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent2); color: #2b1d00;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 17px;
  }
  .copy-btn { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; cursor: pointer; background: none; color: var(--text); margin-top: 14px; }
  .footer-links { text-align: center; font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.8; }
  .footer-links a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row"><a href="https://naginata-work.github.io/" class="home-link" title="All tools">🧰</a><button class="lang-btn" id="langBtn">EN</button></div>
  <h1 id="title">🎱 ランダム数字抽選ツール</h1>
  <p class="lead" id="lead">範囲内から重複なしで、指定した個数の数字を抽選します。</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label id="minLabel">最小値</label>
        <input type="number" id="minVal" value="1">
      </div>
      <div class="field">
        <label id="maxLabel">最大値</label>
        <input type="number" id="maxVal" value="49">
      </div>
    </div>
    <div class="field">
      <label id="countLabel">抽選する個数</label>
      <input type="number" id="countVal" value="6" min="1">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="uniqueCheck" checked>
      <label for="uniqueCheck" id="uniqueLabel" style="margin:0;"></label>
    </div>
    <button class="draw-btn" id="drawBtn"></button>
    <div class="balls" id="balls"></div>
    <button class="copy-btn" id="copyBtn" style="display:none;"></button>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="aboutTitle" style="font-size:15px; color:var(--text); margin:0 0 8px;"></h2>
    <p id="aboutBody1" style="margin:0 0 10px;"></p>
    <p id="aboutBody2" style="margin:0;"></p>
  </div>

  <div class="card" style="font-size:13px; line-height:1.9; color:var(--sub);">
    <h2 id="faqTitle" style="font-size:15px; color:var(--text); margin:0 0 10px;"></h2>
    <p id="faq1Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq1A" style="margin:0 0 12px;"></p>
    <p id="faq2Q" style="margin:0 0 4px; color:var(--text); font-weight:bold;"></p>
    <p id="faq2A" style="margin:0;"></p>
  </div>

  <p class="footer-links" id="footerLinks"></p>
  <p style="text-align:center; font-size:11px; color:var(--sub); margin-top:4px;">
    <a href="https://naginata-work.github.io/" style="color:var(--sub);" id="allToolsLink"></a> ・
    <a href="https://naginata-work.github.io/privacy.html" style="color:var(--sub);" id="privacyLink"></a>
  </p>
</div>

<script>
  const I18N = {
    ja: {
      title: '🎱 ランダム数字抽選ツール',
      lead: '範囲内から重複なしで、指定した個数の数字を抽選します。',
      minLabel: '最小値', maxLabel: '最大値', countLabel: '抽選する個数',
      uniqueLabel: '重複なし',
      drawBtn: '抽選する',
      copyBtn: '結果をコピー',
      copied: 'コピーしました!',
      errRange: '最大値は最小値より大きくしてください',
      errCount: '重複なしの場合、個数は範囲内の数字数以下にしてください',
      errMaxCount: '一度に抽選できるのは5000個までです',
      shareText: nums => `抽選結果: ${nums.join(', ')}`,
      footerLinks: '他のツールも作っています → <a href="https://naginata-work.github.io/dice-roller/" target="_blank" rel="noopener">サイコロ</a> / <a href="https://naginata-work.github.io/fair-picker/" target="_blank" rel="noopener">公平くじ引き</a>',
      aboutTitle: '「重複なし」の仕組みについて',
      aboutBody1: '宝くじの番号を決めるとき、抽選会でクジ番号を割り振るときなど、「範囲内から複数の数字を、被りなく選びたい」という場面は意外とあります。単純にランダムな数字を必要な個数分繰り返し生成すると、同じ数字が混ざってしまうことがあります。',
      aboutBody2: 'このツールは範囲と個数を指定すると、「重複なし」にチェックが入っている場合、被りが起きないアルゴリズムで抽選します。範囲が非常に広い場合(20万通りを超える場合)は、集合(Set)を使って重複を検知しながら抽選する方式に自動的に切り替わります。',
      faqTitle: 'よくある質問',
      faq1Q: '重複ありにするのはどんな時?',
      faq1A: 'サイコロを繰り返し振るような、同じ数字が出ても構わないシミュレーションをしたい場合に使います。チェックを外すと、毎回独立してランダムな数字を生成します。',
      faq2Q: '一度に抽選できる個数に上限はある?',
      faq2A: 'はい、極端に大きな数値を指定して動作が重くなるのを防ぐため、1回あたり最大5000個までとしています。',
    },
    en: {
      title: '🎱 Random Number Picker',
      lead: 'Draw a set number of unique random numbers from a range.',
      minLabel: 'Min', maxLabel: 'Max', countLabel: 'How many numbers',
      uniqueLabel: 'No duplicates',
      drawBtn: 'Draw',
      copyBtn: 'Copy result',
      copied: 'Copied!',
      errRange: 'Max must be greater than min',
      errCount: 'With no duplicates, count must be within the range size',
      errMaxCount: 'You can draw at most 5000 numbers at once',
      shareText: nums => `Draw result: ${nums.join(', ')}`,
      footerLinks: 'Also made these → <a href="https://naginata-work.github.io/dice-roller/" target="_blank" rel="noopener">Dice Roller</a> / <a href="https://naginata-work.github.io/fair-picker/" target="_blank" rel="noopener">Fair Picker</a>',
      aboutTitle: 'How "no duplicates" works',
      aboutBody1: "Picking lottery numbers or assigning raffle numbers both need several unique numbers drawn from a range at once. Just generating random numbers one at a time in a loop can easily produce duplicates by chance.",
      aboutBody2: 'Set your range and how many numbers you need, and with "No duplicates" checked, a proper shuffling algorithm guarantees a duplicate-free draw. For very large ranges (over 200,000 possible values), it automatically switches to a set-based approach that checks for duplicates as it goes.',
      faqTitle: 'FAQ',
      faq1Q: 'When would I want duplicates allowed?',
      faq1A: "Useful for simulations where repeats are fine, like repeatedly rolling a die. Uncheck the box and each draw becomes fully independent.",
      faq2Q: 'Is there a limit on how many numbers I can draw at once?',
      faq2A: "Yes — up to 5,000 per draw, to keep the browser from freezing on an unreasonably large request.",
    }
  };

  function loadLang() { try { return localStorage.getItem('randomNumbersLang'); } catch (e) { return null; } }
  function saveLang(l) { try { localStorage.setItem('randomNumbersLang', l); } catch (e) {} }
  let lang = loadLang() === 'en' ? 'en' : 'ja';
  function t() { return I18N[lang]; }

  let lastNumbers = null;

  function drawUnique(min, max, count) {
    const rangeSize = max - min + 1;
    if (rangeSize <= 200000) {
      const pool = Array.from({ length: rangeSize }, (_, i) => min + i);
      for (let i = pool.length - 1; i > 0 && i >= pool.length - count; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(pool.length - count).sort((a, b) => a - b);
    }
    const set = new Set();
    while (set.size < count) {
      set.add(min + Math.floor(Math.random() * rangeSize));
    }
    return [...set].sort((a, b) => a - b);
  }

  function drawWithDuplicates(min, max, count) {
    const result = [];
    for (let i = 0; i < count; i++) {
      result.push(min + Math.floor(Math.random() * (max - min + 1)));
    }
    return result;
  }

  document.getElementById('drawBtn').addEventListener('click', () => {
    const min = parseInt(document.getElementById('minVal').value, 10);
    const max = parseInt(document.getElementById('maxVal').value, 10);
    const count = parseInt(document.getElementById('countVal').value, 10);
    const unique = document.getElementById('uniqueCheck').checked;
    const ballsEl = document.getElementById('balls');

    if (isNaN(min) || isNaN(max) || max <= min) { alert(t().errRange); return; }
    if (unique && count > (max - min + 1)) { alert(t().errCount); return; }
    if (!count || count < 1) return;
    if (count > 5000) { alert(t().errMaxCount); return; }

    const numbers = unique ? drawUnique(min, max, count) : drawWithDuplicates(min, max, count);
    lastNumbers = numbers;
    ballsEl.innerHTML = numbers.map(n => `<div class="ball">${n}</div>`).join('');
    document.getElementById('copyBtn').style.display = 'block';
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!lastNumbers) return;
    const text = t().shareText(lastNumbers) + ' ' + location.href;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = t().copied;
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch { alert(text); }
  });

  function renderStaticText() {
    document.getElementById('title').textContent = t().title;
    document.getElementById('lead').textContent = t().lead;
    document.getElementById('minLabel').textContent = t().minLabel;
    document.getElementById('maxLabel').textContent = t().maxLabel;
    document.getElementById('countLabel').textContent = t().countLabel;
    document.getElementById('uniqueLabel').textContent = t().uniqueLabel;
    document.getElementById('drawBtn').textContent = t().drawBtn;
    document.getElementById('copyBtn').textContent = t().copyBtn;
    document.getElementById('footerLinks').innerHTML = t().footerLinks;
    document.getElementById('aboutTitle').textContent = t().aboutTitle;
    document.getElementById('aboutBody1').textContent = t().aboutBody1;
    document.getElementById('aboutBody2').textContent = t().aboutBody2;
    document.getElementById('faqTitle').textContent = t().faqTitle;
    document.getElementById('faq1Q').textContent = t().faq1Q;
    document.getElementById('faq1A').textContent = t().faq1A;
    document.getElementById('faq2Q').textContent = t().faq2Q;
    document.getElementById('faq2A').textContent = t().faq2A;
    document.getElementById('allToolsLink').textContent = lang === 'ja' ? '他のツール一覧' : 'All tools';
    document.getElementById('allToolsLink').href = 'https://naginata-work.github.io/';
    document.getElementById('privacyLink').textContent = lang === 'ja' ? 'プライバシーポリシー' : 'Privacy policy';
    document.getElementById('privacyLink').href = 'https://naginata-work.github.io/privacy.html';
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    saveLang(lang);
    document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
    renderStaticText();
  });

  document.getElementById('langBtn').textContent = lang === 'ja' ? 'EN' : 'JA';
  renderStaticText();
</script>
</body>
</html>
